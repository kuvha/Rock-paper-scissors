
<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <title>RSP</title>
</head>
<body>
  <h1>
    Rock Paper Scissors
  </h1>
  <button onclick="
   onPlay('Rock');
    ">Rock</button>
  <button onclick="
    onPlay('Paper');
    "
    >Paper</button>
  <button onclick="
    onPlay('Scissors');
    ">Scissors</button>
  <button onclick="
    resetScore();
    ">Reset</button>
  
  <script>
let  score;
if(!localStorage.getItem('scoreFile')){
  score={
    wins:0,
    losses:0,
    ties:0  
  };
}else{
 score = JSON.parse(localStorage.getItem('scoreFile'));
} 
  
  
  
  
  let computerMove;
  
  function generateComputerMove()
  {
    let randomNumber= Math.random();
    
    if(randomNumber<1/3){
      computerMove="Rock";
    }else if(randomNumber>=2/3){
      computerMove="Scissors";
    }else{
      computerMove="Paper";
    }
  }
  
  
  
  let playerMove;
  let result;
  
  function play(){
    if(playerMove===computerMove){
      result="Tie";
      score.ties++;
    }else if( playerMove==="Rock" ){
      if(computerMove==="Paper"){
        result="Lose";
        score.losses++;
      }else{
        result="Win";
        score.wins++;
      }
      
    }
    else if( playerMove==="Paper"){
      if(computerMove==="Rock"){
        result = "Win";
        score.wins++;
      }else{
        result="Lose";
        score.losses++;
      }
      
    }else{
      if(computerMove==="Rock"){
       result="Lose";
       score.losses++;
      }else{
        result="Win";
        score.wins++;
      }
      
    }
  }
  
  function displayResult()
  {
    alert(`You picked ${playerMove}
Computer picked ${computerMove}
You ${result}
Wins ${score.wins}, Losses ${score.losses}, Ties ${score.ties}`);
  }
  
  function onPlay(move){
     playerMove=move;
    generateComputerMove();
    play();
    displayResult();
    saveScore();
  }
  
  function saveScore(){
   localStorage.setItem('scoreFile',JSON.stringify(score));
  }
  function resetScore(){
    score.wins=0;
    score.losses=0;
    score.ties=0;
    saveScore();
  }
  
  </script>
</body>
</html>
